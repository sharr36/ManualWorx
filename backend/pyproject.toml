[project]
name = "manualworx-backend"
version = "0.1.0"
description = "ManualWorx API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "stripe>=8.0.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "boto3>=1.35.0",
    "qdrant-client>=1.12.0",
    "arq>=0.26.0",
    "PyMuPDF>=1.24.0",
    "Jinja2>=3.1.0",
    "redis>=5.0.0",
    "manualworx-shared @ file:///${PROJECT_ROOT}/../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
