app = "manualworx-qdrant"
primary_region = "ord"

[build]
  image = "qdrant/qdrant:latest"

[mounts]
  source = "qdrant_data"
  destination = "/qdrant/storage"

# No [http_service] — Qdrant is internal-only, reachable via
# manualworx-qdrant.internal:6333 from other Fly apps.

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    port = 6333
    timeout = "5s"
    type = "http"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
