app = "manualworx-qdrant"
primary_region = "ord"

[build]
  image = "qdrant/qdrant:latest"

[mounts]
  source = "qdrant_data"
  destination = "/qdrant/storage"

# Internal-only service — reachable via manualworx-qdrant.flycast:6333
[[services]]
  internal_port = 6333
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 6333

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    port = 6333
    timeout = "5s"
    type = "http"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
