app = "manualworx-qdrant"
primary_region = "ord"

[build]
  image = "qdrant/qdrant:latest"

[mounts]
  source = "qdrant_data"
  destination = "/qdrant/storage"

[http_service]
  internal_port = 6333
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[services]]
  protocol = "tcp"
  internal_port = 6334

  [[services.ports]]
    port = 6334

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
