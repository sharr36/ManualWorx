[project]
name = "manualworx-docgen"
version = "0.1.0"
description = "ManualWorx document generation service — PDF and Word document output"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "weasyprint>=62",
    "python-docx>=1.1",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "manualworx-shared @ file:///${PROJECT_ROOT}/../shared",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
