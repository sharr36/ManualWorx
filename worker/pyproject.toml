[project]
name = "manualworx-worker"
version = "0.1.0"
description = "ManualWorx ingestion worker — PDF processing, OCR, embedding, and classification"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26",
    "asyncpg>=0.29",
    "redis>=5.0",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "httpx>=0.27",
    "boto3>=1.35",
    "qdrant-client>=1.12",
    "pydantic-settings>=2.0",
    "manualworx-shared @ file:///${PROJECT_ROOT}/../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
